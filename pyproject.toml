[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rps7200"
version = "0.1.0"
description = "Console and Python scanning for the Reflecta RPS 7200, with raw RGB + infrared output"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Stefan Kurzella"}]
keywords = ["scanner", "film", "negative", "infrared", "usb", "reflecta", "pieusb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# Only changes which TIFF implementation is used; the built-in one is complete.
tifffile = ["tifffile>=2021.7.2"]

[project.scripts]
rps7200 = "rps7200.cli:main"

[tool.setuptools]
packages = ["rps7200"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov>=7.0",
    "ruff==0.14.10",
    "ty>=0.0.26",
    # Not a runtime dependency -- the built-in TIFF path is complete. It is here
    # so `make test` can run the cross-implementation matrix, which needs both
    # implementations present. `make test-no-tifffile` covers the bare install.
    "tifffile>=2021.7.2",
    # tools/make_comparison.py writes the preview PNGs Stefan judges by eye.
    # A tool dependency, not a runtime one: the driver itself never imports it.
    "pillow>=9",
]

[tool.pytest.ini_options]
markers = [
    "hardware: needs the scanner attached, powered and loaded (deselect with '-m not hardware')",
    "slow: wall-clock tests that read real library entries from disk",
]
# The suite must stay runnable with no scanner on the bus: a test that needs one
# is opt-in, never the default.
addopts = "-m 'not hardware'"
# Lets test modules share the fakes via `from conftest import ...`.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    ".pytest_cache",
    "build",
    "dist",
    # Scanner output and captures, none of it source.
    "library",
    "scans",
    "previews",
    "rolls",
    "rollscan",
    "walk7",
    "captures",
    "calibration",
]

[tool.coverage.run]
source = ["rps7200"]
