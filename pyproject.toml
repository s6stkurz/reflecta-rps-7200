[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rps7200"
version = "0.1.0"
description = "Console and Python scanning for the Reflecta RPS 7200, with raw RGB + infrared output"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Stefan Kurzella"}]
keywords = ["scanner", "film", "negative", "infrared", "usb", "reflecta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "numpy>=1.21",
    # Windows only, and only because there is nowhere conventional for
    # libusb-1.0.dll to live there: macOS has Homebrew and Linux has a package,
    # so on both of those a system libusb is found and preferred. A 166 kB
    # wheel is a smaller price than telling someone to go and find a DLL.
    # The lazy loader still means host-side work never touches it.
    "libusb-package>=1.0.26; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only changes which TIFF implementation is used; the built-in one is complete.
tifffile = ["tifffile>=2021.7.2"]
# Saving a delivered file as JPEG instead of TIFF. Unlike `tifffile` there is no
# built-in equivalent -- nothing here encodes a JPEG by hand -- so without this
# the window says so and writes the TIFF, rather than losing the scan.
jpeg = ["pillow>=9"]
# A bundled libusb, for a macOS or Linux machine that would rather not install
# one system-wide. It is already a dependency on Windows, where there is no
# system-wide place to install one; here it is opt-in, and the loader still
# prefers whatever the system has.
usb = ["libusb-package>=1.0.26"]

[tool.setuptools]
packages = ["rps7200"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov>=7.0",
    "ruff==0.14.10",
    "ty>=0.0.26",
    # Not a runtime dependency -- the built-in TIFF path is complete. It is here
    # so `make test` can run the cross-implementation matrix, which needs both
    # implementations present. `make test-no-tifffile` covers the bare install.
    "tifffile>=2021.7.2",
    # Two jobs now: tools/make_comparison.py writes the preview PNGs Stefan
    # judges by eye, and `rps7200.export` encodes JPEGs with it. The second is a
    # runtime path, which is why `[project.optional-dependencies] jpeg` exists
    # above; it is here as well so `make test` can cover the JPEG path.
    "pillow>=9",
    # A runtime dependency on Windows only, and here unconditionally so that the
    # type checker resolves it on all three platforms. Without it `ty` reads
    # `import libusb_package` as unresolved on macOS and Linux and the board goes
    # red on two runners out of three, while Windows -- where the wheel is
    # installed -- passes. An inline `ty: ignore` swaps which platform fails
    # rather than fixing it: with the module present the suppression is itself
    # unused, and that is an error too. Measured, not assumed; see below.
    #
    # Installing it everywhere is also the better answer on the merits. It means
    # the checker reads the Windows branch of the loader on every platform, and
    # this branch exists because nothing ran this suite anywhere but one Mac.
    # It does not change what the loader picks: `_load_libusb` tries a system
    # libusb first and only then the bundled copy, and
    # `tests/test_optional_libraries.py` proves the nothing-found path by hiding
    # the module explicitly rather than by relying on its absence.
    "libusb-package>=1.0.26",
]

[tool.pytest.ini_options]
markers = [
    "hardware: needs the scanner attached, powered and loaded (deselect with '-m not hardware')",
    "slow: wall-clock tests that read real library entries from disk",
]
# The suite must stay runnable with no scanner on the bus: a test that needs one
# is opt-in, never the default.
addopts = "-m 'not hardware'"
# Lets test modules share the fakes via `from conftest import ...`.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    ".pytest_cache",
    "build",
    "dist",
    # Scanner output and captures, none of it source.
    "library",
    "demo",
    "scans",
    "previews",
    "rolls",
    "rollscan",
    "walk7",
    "captures",
    "calibration",
]

[tool.coverage.run]
source = ["rps7200"]
